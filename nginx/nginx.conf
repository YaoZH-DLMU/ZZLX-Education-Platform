events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 500m;

    # ── HTTP：域名访问自动跳转 HTTPS ──────────────────────────
    server {
        listen 80;
        server_name example.com www.example.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTP：IP 直接访问（保留兼容）──────────────────────────
    server {
        listen 80;
        server_name 127.0.0.1;

        location = / {
            root  /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /ZZLX { return 301 /ZZLX/; }
        location = /LLLX { return 301 /LLLX/; }
        location = /GCLX { return 301 /GCLX/; }
        location = /HHLX { return 301 /HHLX/; }

        location /ZZLX/ {
            proxy_pass http://web:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /ZZLX;
            proxy_read_timeout 120s;
        }
        location /LLLX/ {
            proxy_pass http://web:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /LLLX;
            proxy_read_timeout 120s;
        }
        location /GCLX/ {
            proxy_pass http://web:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /GCLX;
            proxy_read_timeout 120s;
        }
        location /HHLX/ {
            proxy_pass http://web:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /HHLX;
            proxy_read_timeout 120s;
        }

        location /static/ {
            proxy_pass http://web:5000/static/;
            proxy_set_header Host $host;
            limit_rate_after 2m;
            limit_rate 200k;
        }
    }

    # ── HTTPS：域名正式访问 ─────────────────────────────────
    server {
        listen 443 ssl;
        server_name example.com www.example.com;

        ssl_certificate     /etc/nginx/ssl/www.example.com.pem;
        ssl_certificate_key /etc/nginx/ssl/www.example.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 落地页
        location = / {
            root  /usr/share/nginx/html;
            try_files /index.html =404;
            expires -1;
        }
        location = /index.html {
            root  /usr/share/nginx/html;
            expires -1;
        }
        location ~* ^/[^/]+\.(png|jpg|jpeg|gif|svg|ico|webp)$ {
            root  /usr/share/nginx/html;
            try_files $uri =404;
            expires 7d;
        }

        # 4 门课（无斜杠 -> 带斜杠）
        location = /ZZLX { return 301 https://$host/ZZLX/; }
        location = /LLLX { return 301 https://$host/LLLX/; }
        location = /GCLX { return 301 https://$host/GCLX/; }
        location = /HHLX { return 301 https://$host/HHLX/; }

        # 4 门课代理
        location /ZZLX/ {
            proxy_pass         http://web:5000/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /ZZLX;
            proxy_read_timeout 120s;
        }
        location /LLLX/ {
            proxy_pass         http://web:5000/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /LLLX;
            proxy_read_timeout 120s;
        }
        location /GCLX/ {
            proxy_pass         http://web:5000/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /GCLX;
            proxy_read_timeout 120s;
        }
        location /HHLX/ {
            proxy_pass         http://web:5000/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /HHLX;
            proxy_read_timeout 120s;
        }

        # 静态文件（4课共用 CSS/JS/图片）
        location /static/ {
            proxy_pass http://web:5000/static/;
            proxy_set_header Host $host;
            limit_rate_after 2m;
            limit_rate 200k;
        }

        # 裸路径兜底（前端 JS 硬编码的 fetch('/api/...') 等）
        # 不设 X-Forwarded-Prefix，让 Flask 通过 session course_key 判断课程
        location /api/ {
            proxy_pass         http://web:5000/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
        location /teacher/ {
            proxy_pass         http://web:5000/teacher/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /student/ {
            proxy_pass         http://web:5000/student/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /s/ {
            proxy_pass         http://web:5000/s/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /video/ {
            proxy_pass         http://web:5000/video/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /KG.json {
            proxy_pass         http://web:5000/KG.json;
            proxy_set_header   Host              $host;
        }
        location /QG.json {
            proxy_pass         http://web:5000/QG.json;
            proxy_set_header   Host              $host;
        }
    }
}
